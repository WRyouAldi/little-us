<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160d20"><title>Little Us — The World of Your Story</title>
<style>
:root{color-scheme:dark;--rose:#f3c4cf;--gold:#f6d991;--ink:#160d20}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100b1b;color:#fff3f3;font-family:system-ui,-apple-system,sans-serif}#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}.top{position:fixed;z-index:2;top:calc(20px + env(safe-area-inset-top));left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{font-size:11px;font-weight:800;letter-spacing:.23em;text-shadow:0 2px 16px #000}.brand small{display:block;margin-top:4px;font-weight:400;letter-spacing:.08em;opacity:.75}.chip{pointer-events:auto;border:1px solid #fff3;background:#20162bbf;color:#fff0f3;border-radius:99px;padding:10px 14px;backdrop-filter:blur(16px)}.bottom{position:fixed;z-index:2;bottom:calc(22px + env(safe-area-inset-bottom));left:18px;right:18px;text-align:center;pointer-events:none}.hint{font-size:12px;line-height:1.5;color:#ffeff5;text-shadow:0 2px 12px #000;max-width:320px;margin:0 auto 12px}.actions{display:flex;justify-content:center;gap:9px;pointer-events:auto}.actions button{flex:1;max-width:150px;border:1px solid #fff3;background:#21152dcc;color:#fff2f4;border-radius:18px;padding:12px 8px;backdrop-filter:blur(16px);font-size:12px}.actions b{display:block;font-size:20px;color:var(--rose);margin-bottom:3px}.overlay{position:fixed;z-index:5;inset:0;background:#0b0712b8;backdrop-filter:blur(9px);display:none;align-items:flex-end;justify-content:center;padding:16px}.overlay.show{display:flex}.panel{width:min(100%,440px);max-height:76dvh;overflow:auto;border:1px solid #f5d68e3d;border-radius:27px;background:linear-gradient(150deg,#41283f,#170f22);padding:23px;box-shadow:0 22px 80px #0008}.kicker{font-size:9px;letter-spacing:.24em;color:var(--gold);margin-bottom:12px}.date{font-size:11px;letter-spacing:.14em;color:var(--gold);margin:0 0 14px}.panel h1{font-size:25px;line-height:1.15;margin:0 0 10px}.panel p{font-size:14px;line-height:1.65;color:#f4e4ed}.source{font-size:11px;line-height:1.6;color:#dfc3d2;border-left:2px solid #d8a9b9;padding-left:10px;margin:16px 0}.row{display:flex;gap:8px}.row button,.close{flex:1;border:0;border-radius:14px;padding:13px;background:#f0c7ce;color:#30152c;font-weight:700}.row .secondary,.close{background:#ffffff12;color:#fff}.close{width:100%;margin-top:8px}.counter{font-size:10px;letter-spacing:.15em;color:#e9cbd8;margin-bottom:12px}@media(min-width:700px){.bottom{bottom:24px}.overlay{align-items:center}.panel{max-height:80dvh}}
</style></head><body>
<canvas id="world" aria-label="Taman 3D Little Us. Sentuh cahaya untuk membuka kenangan berdasarkan chat asli."></canvas>
<header class="top"><div class="brand">LITTLE US<small>A WORLD MADE OF US</small></div><button class="chip" id="journey">Perjalanan ♡</button></header>
<div class="bottom"><div class="hint" id="hint">Jelajahi taman. Sentuh titik cahaya untuk membuka potongan cerita dari chat kalian.</div><div class="actions"><button id="miss"><b>♡</b>Kangen</button><button id="hug"><b>☁</b>Peluk</button><button id="daisy"><b>🌼</b>Daisy</button></div></div>
<div class="overlay" id="memory"><article class="panel"><div class="kicker">LITTLE US · MEMORY WORLD</div><div class="counter" id="counter"></div><div class="date" id="date"></div><h1 id="title"></h1><p id="body"></p><div class="source" id="source"></div><div class="row"><button class="secondary" id="prev">← Sebelumnya</button><button id="next">Berikutnya →</button></div><button class="close" id="close">Kembali ke dunia</button></article></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const moments=[
{date:'07 APRIL 2025',title:'Hal kecil yang dijaga',body:'Perhatian muncul lewat hal sederhana: memastikan sudah makan, menyemangati pekerjaan, mengingatkan istirahat, dan memastikan perjalanan aman.',source:'Jejak sumber: percakapan 7 April 2025 tentang makanan, rutinitas kerja, kelelahan, dan istirahat.'},
{date:'08 APRIL 2025',title:'Candaan yang jadi milik kita',body:'Obrolan ringan berkembang menjadi lelucon berulang tentang foto kaki, foto rambut, dan mencari angin bersama. Keakraban terlihat dari cara kalian meneruskan candaan itu.',source:'Jejak sumber: percakapan 8 April 2025 tentang foto, sandal, dan rencana mencari angin bersama.'},
{date:'27 NOVEMBER 2025',title:'Tanggal yang kita tandai',body:'Tanggal ini menjadi penanda hubungan di Little Us. Percakapan sebelum tanggal ini tetap diperlakukan sebagai bagian perjalanan menuju penanda tersebut.',source:'Jejak sumber: tanggal hubungan yang ditetapkan pada proyek Little Us; bukan kutipan WhatsApp.'},
{date:'03 DESEMBER 2025',title:'Bahasa kecil kita',body:'Gaya bercanda khas muncul lewat typo lucu, panggilan sayang, dan obrolan kopi serta makanan.',source:'Jejak sumber: percakapan 3 Desember 2025 tentang kopi, makanan, dan candaan salah ketik.'},
{date:'18 AGUSTUS 2026',title:'Candaan yang berulang',body:'Gurauan tentang matahari pagi dan vitamin D dipelesetkan menjadi permainan kata dengan nama Desi. Momen kecil seperti ini membuat dunia terasa milik kalian.',source:'Jejak sumber: percakapan 18 Agustus 2026 tentang jogging, matahari, dan permainan kata vitamin D.'},
{date:'11 SEPTEMBER 2026',title:'Saat komunikasi berubah',body:'Percakapan memuat pembicaraan serius tentang perubahan komunikasi, rasa kurang mendapat kabar, dan permintaan maaf. Momen ini ditampilkan untuk refleksi, bukan untuk menyalahkan siapa pun.',source:'Jejak sumber: percakapan 11 September 2026 tentang perubahan komunikasi dan saling menjelaskan.'},
{date:'16 OKTOBER 2026',title:'Tetap saling mendukung',body:'Obrolan berisi bantuan memahami pilihan pekerjaan dan dokumen lamaran, diselingi pengingat untuk makan. Dukungan juga hadir lewat hal praktis sehari-hari.',source:'Jejak sumber: percakapan 16 Oktober 2026 tentang lamaran kerja dan saling mengingatkan makan.'}
];
const $=id=>document.getElementById(id);let current=0;
function openMoment(i){current=(i+moments.length)%moments.length;const m=moments[current];$('date').textContent=m.date;$('title').textContent=m.title;$('body').textContent=m.body;$('source').textContent=m.source;$('counter').textContent='KENANGAN '+String(current+1).padStart(2,'0')+' / '+String(moments.length).padStart(2,'0');$('prev').disabled=current===0;$('next').textContent=current===moments.length-1?'Ulangi perjalanan ↻':'Berikutnya →';$('memory').classList.add('show')}
$('journey').onclick=()=>openMoment(0);$('prev').onclick=()=>openMoment(current-1);$('next').onclick=()=>openMoment(current+1);$('close').onclick=()=>$('memory').classList.remove('show');
$('miss').onclick=()=>{$('hint').textContent='Kangen itu juga bagian dari dunia kalian. Sentuh cahaya untuk mengingat ♡';pulsate()};$('hug').onclick=()=>{$('hint').textContent='Satu pelukan kecil untuk hari ini ☁';pulsate()};$('daisy').onclick=()=>openMoment(3);
const canvas=$('world'),scene=new THREE.Scene();scene.background=new THREE.Color('#120c1b');scene.fog=new THREE.FogExp2('#21162b',.027);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,3.2,10.6);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
scene.add(new THREE.HemisphereLight('#c6c2ed','#211629',2));const moonLight=new THREE.DirectionalLight('#c8d3ff',1.5);moonLight.position.set(-4,8,5);moonLight.castShadow=true;scene.add(moonLight);const warm=new THREE.PointLight('#ffb96b',17,9,2);warm.position.set(0,1.5,-2.2);scene.add(warm);
function mat(color,roughness=.8,extra={}){return new THREE.MeshStandardMaterial({color,roughness,...extra})}function addMesh(geo,material,pos,scale){const o=new THREE.Mesh(geo,material);o.position.set(...pos);if(scale)o.scale.set(...scale);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
const moon=addMesh(new THREE.SphereGeometry(.55,32,24),mat('#fff0ca',.7,{emissive:'#ffce83',emissiveIntensity:1.6}),[3.3,5.6,-5]);const glow=addMesh(new THREE.SphereGeometry(.82,20,16),new THREE.MeshBasicMaterial({color:'#ffdba4',transparent:true,opacity:.07,depthWrite:false}),[3.3,5.6,-5]);
const ground=addMesh(new THREE.PlaneGeometry(60,60,48,48),mat('#26342e',1),[0,-.08,0]);ground.rotation.x=-Math.PI/2;const gp=ground.geometry.attributes.position;for(let i=0;i<gp.count;i++){gp.setZ(i,Math.sin(gp.getX(i)*.38)*.12+Math.cos(gp.getY(i)*.32)*.1)}ground.geometry.computeVertexNormals();
for(let i=0;i<5;i++){const hill=addMesh(new THREE.SphereGeometry(1,36,18,0,Math.PI*2,0,Math.PI/2),mat(['#343044','#343449','#2a3440','#25333b','#222d37'][i]),[(i%2?2.5:-2.5),-.15-i*.09,-5-i*1.35],[8+i*1.2,1.05+i*.13,2.3])}
const cottageMat=mat('#50384d'),roofMat=mat('#2a2036'),trim=mat('#c39a9e'),glass=mat('#ffca77',.25,{emissive:'#ff9c3c',emissiveIntensity:2.1});
addMesh(new THREE.BoxGeometry(2.8,1.7,1.8),cottageMat,[0,.84,-2.5]);const roofGeo=new THREE.BufferGeometry();roofGeo.setAttribute('position',new THREE.Float32BufferAttribute([-1.65,1.7,-3.5,0,2.75,-3.5,1.65,1.7,-3.5,-1.65,1.7,-1.5,0,2.75,-1.5,1.65,1.7,-1.5],3));roofGeo.setIndex([0,1,2,3,5,4,0,3,4,0,4,1,1,4,5,1,5,2]);roofGeo.computeVertexNormals();const roof=new THREE.Mesh(roofGeo,roofMat);roof.castShadow=true;scene.add(roof);
for(const x of [-.82,.82]){addMesh(new THREE.BoxGeometry(.48,.58,.07),trim,[x,1.04,-1.56]);addMesh(new THREE.BoxGeometry(.34,.43,.035),glass,[x,1.05,-1.51])}addMesh(new THREE.BoxGeometry(.48,.9,.08),mat('#20172a'),[0,.46,-1.57]);
const flower=new THREE.Group();flower.position.set(-1.0,1.18,.15);scene.add(flower);const stem=new THREE.Mesh(new THREE.CylinderGeometry(.035,.05,1.55,10),mat('#64835c'));stem.position.set(0,-.78,0);stem.rotation.z=-.12;flower.add(stem);for(let i=0;i<2;i++){const leaf=new THREE.Mesh(new THREE.SphereGeometry(.24,16,10),mat('#75966a'));leaf.scale.set(1.5,.42,.22);leaf.position.set(i?-.19:.2,-.75-i*.3,0);leaf.rotation.z=i?-.55:.48;flower.add(leaf)}
const petals=[];for(let i=0;i<13;i++){const a=i*Math.PI*2/13;const p=new THREE.Mesh(new THREE.SphereGeometry(1,18,12),mat(i%3===0?'#e6c67a':'#fff0c1',.48));p.scale.set(.17,.42,.085);p.position.set(Math.cos(a)*.36,.04+Math.sin(a)*.36,0);p.rotation.z=-a+Math.PI/2;flower.add(p);petals.push(p)}const center=addMesh(new THREE.SphereGeometry(.24,24,16),mat('#8d5628'),[-1,1.2,.23]);scene.remove(center);center.position.set(0,.02,.08);flower.add(center);
const beaconMat=mat('#f5d68e',.25,{emissive:'#ffca78',emissiveIntensity:2});const beaconGlow=new THREE.MeshBasicMaterial({color:'#f5d68e',transparent:true,opacity:.14,depthWrite:false});const beacons=[];const positions=[[-2.65,.45,.25],[-2.05,.58,-1.2],[-.65,.5,-2],[1.55,.68,-.55],[2.45,.55,-2],[1.85,.78,-3.4],[-1.8,.63,-3.4]];
positions.forEach((p,i)=>{const g=new THREE.Group();g.position.set(...p);g.userData.memoryIndex=i;const c=new THREE.Mesh(new THREE.SphereGeometry(.075,14,10),beaconMat);c.userData.memoryIndex=i;g.add(c);const h=new THREE.Mesh(new THREE.SphereGeometry(.2,14,10),beaconGlow);h.userData.memoryIndex=i;g.add(h);scene.add(g);beacons.push({g,c,h,phase:i*.8,baseY:p[1]})});
const fireflies=[];const flymat=new THREE.MeshBasicMaterial({color:'#f7dca0'});for(let i=0;i<36;i++){const o=addMesh(new THREE.SphereGeometry(.018+(i%3)*.006,8,6),flymat,[(Math.random()-.5)*11,.3+Math.random()*2.2,-1-Math.random()*8]);fireflies.push({o,phase:Math.random()*6.28,y:o.position.y,x:o.position.x})}
const starPos=[];for(let i=0;i<180;i++)starPos.push((Math.random()-.5)*22,2+Math.random()*9,-7-Math.random()*12);const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:'#dcd9f4',size:.035,transparent:true,opacity:.7})));
let tx=0,ty=0,cx=0,cy=1.05;canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*.6;ty=((e.clientY-r.top)/r.height-.5)*.22},{passive:true});
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();canvas.addEventListener('click',e=>{if($('memory').classList.contains('show'))return;const r=canvas.getBoundingClientRect();ndc.x=((e.clientX-r.left)/r.width)*2-1;ndc.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(ndc,camera);const hit=ray.intersectObjects([...beacons.flatMap(b=>[b.c,b.h]),...flower.children],true)[0];if(hit){let o=hit.object;while(o&&!Number.isInteger(o.userData.memoryIndex)&&o.parent)o=o.parent;if(o&&Number.isInteger(o.userData.memoryIndex))openMoment(o.userData.memoryIndex);else openMoment(3)}},{passive:true});
function pulsate(){flower.scale.setScalar(1.12);setTimeout(()=>flower.scale.setScalar(1),420)}
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();cx+=(tx-cx)*.025;cy+=(1.05+ty-cy)*.025;camera.position.x=cx;camera.lookAt(cx*.3,cy,0);flower.rotation.z=Math.sin(t*.7)*.025;flower.position.y=1.18+Math.sin(t*.85)*.045;glow.material.opacity=.05+Math.sin(t*.45)*.02;beacons.forEach(b=>{b.g.position.y=b.baseY+Math.sin(t*1.2+b.phase)*.045;b.c.scale.setScalar(1+Math.sin(t*2+b.phase)*.12);b.h.material.opacity=.08+(Math.sin(t*1.4+b.phase)+1)*.04});fireflies.forEach(f=>{f.o.position.y=f.y+Math.sin(t*1.2+f.phase)*.16;f.o.position.x=f.x+Math.sin(t*.35+f.phase)*.08});renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.position.z=innerWidth<500?11.8:9.6;camera.position.y=innerWidth<500?3.65:3.2;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight,false)});
</script></body></html>
